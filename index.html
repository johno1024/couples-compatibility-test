<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0b10"><title>The Couple Check ♥</title><style>:root{--bg:#0c0b10;--card:#1b1922;--text:#f8f5fb;--muted:#bbb2c5;--a:#a765ff;--b:#ff5da7;--line:#3a3342}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#8c52ff35,transparent 32%),radial-gradient(circle at 100% 8%,#ff4f9d28,transparent 34%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(760px,100%);margin:auto;padding:20px 14px calc(72px + env(safe-area-inset-bottom))}.screen{min-height:calc(100vh - 92px);display:flex;flex-direction:column;justify-content:center}.hero{text-align:center;margin-bottom:18px}.eyebrow,.kicker{font-size:.75rem;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:#e0cbea}.hero h1{font-size:clamp(2.7rem,11vw,5rem);line-height:.92;letter-spacing:-.06em;margin:12px 0}.grad{background:linear-gradient(90deg,#c6a2ff,#ff82ba);-webkit-background-clip:text;color:transparent}.sub,.tiny{color:var(--muted);line-height:1.6}.tiny{font-size:.82rem}.card{background:linear-gradient(180deg,#1e1a26,#17141d);border:1px solid #ffffff14;border-radius:26px;padding:22px;box-shadow:0 24px 70px #0008;margin:12px 0}.btn,.option,.rate{appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent}.btn{width:100%;border:0;border-radius:17px;padding:15px 18px;min-height:52px;margin-top:10px;font-size:.98rem;font-weight:850;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));cursor:pointer}.btn.alt{background:#292333;border:1px solid #44394f}.btn.ghost{background:#ffffff05;border:1px solid var(--line);color:#d9cfdf}.btn:disabled{opacity:.4}.row{display:flex;gap:10px}.row .btn{flex:1}.input{width:100%;padding:15px;border-radius:15px;border:1px solid #403747;background:#100f15;color:#fff;font-size:1rem}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:#271f31;border:1px solid #4b3d59;color:#eadcf6;font-size:.76rem;font-weight:800}.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.back{border:0;background:transparent;color:#cfc2d8;font-weight:800;padding:8px}.pb{flex:1}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;font-weight:800;text-transform:uppercase}.prog,.bar{height:8px;background:#292331;border-radius:99px;overflow:hidden;margin-top:7px}.prog i,.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .25s}.q{font-size:clamp(1.55rem,6vw,2.25rem);line-height:1.14;letter-spacing:-.03em;margin:15px 0}.opts{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:15px;border-radius:18px;border:1px solid #393240;background:#121017;color:#fff;font-size:1rem;line-height:1.35}.option.sel{border-color:#bc7dff;background:#271a34;box-shadow:0 0 0 2px #a765ff22 inset}.badge{flex:0 0 30px;height:30px;border-radius:10px;background:#2b2437;display:grid;place-items:center;font-weight:850}.option.sel:after{content:'✓';margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-weight:900}.ratings{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.rate{min-height:48px;border-radius:13px;border:1px solid #393240;background:#121017;color:#fff;font-weight:850}.rate.sel{background:#603a76;border-color:#c486ff}.anchors{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;margin-top:8px}.code{word-break:break-all;background:#0f0e13;border:1px dashed #594a68;padding:13px;border-radius:14px;font:12px ui-monospace,monospace;line-height:1.5}.score{font-size:clamp(5rem,25vw,8rem);font-weight:950;letter-spacing:-.08em;line-height:.9;text-align:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.scorebox,.compare,.challenge{padding:16px;border-radius:18px;border:1px solid #3c3444;background:#121017}.scorebox strong{font-size:1.65rem}.compare{margin-top:10px}.compare .who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.answer{padding:10px;border-radius:12px;background:#211a29;font-size:.86rem}.challenge{margin-top:10px;background:#1d1624}.challenge strong{display:block;margin-bottom:6px}.qa{position:fixed;z-index:50;right:10px;bottom:10px;width:min(330px,calc(100vw - 20px));background:#100d14f2;border:1px solid #9f6bd4;border-radius:18px;padding:12px;box-shadow:0 20px 60px #000}.qa h3{margin:0 0 6px}.qa .row{display:grid;grid-template-columns:1fr 1fr}.qa .btn{min-height:40px;padding:9px;font-size:.78rem;margin-top:6px}.hidden{display:none!important}@media(max-width:560px){.wrap{padding:14px 11px 70px}.card{padding:18px;border-radius:22px}.grid{grid-template-columns:1fr}.row{flex-direction:column;gap:0}.who{grid-template-columns:1fr!important}.screen{min-height:calc(100vh - 84px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main id="app" class="wrap"></main><div id="qa" class="qa hidden"></div><script>
const Q=[
{c:'Communication',t:'mc',q:'When something is bothering you, what feels healthiest?',o:['Talk about it fairly soon','Take a little time, then talk','Wait until my partner notices','Avoid it unless it becomes serious']},{c:'Communication',t:'multi',q:'What helps you feel heard in a serious conversation?',o:['Eye contact and full attention','Questions that show curiosity','Validation before advice','A calm tone','A clear solution or next step']},{c:'Communication',t:'rate',q:'How important is frequent communication throughout the day?'},{c:'Communication',t:'situ',q:'Situation: You send an important message and your partner does not reply for several hours. What is most like your first reaction?',o:['Assume they are busy and wait','Send a light follow-up','Check on them','Feel uneasy but wait to discuss it','Call or message again for reassurance']},
{c:'Trust',t:'mc',q:'How much independence feels right in a relationship?',o:['A lot; trust and autonomy matter','A balance of togetherness and independence','Mostly doing things together','Frequent reassurance and check-ins']},{c:'Trust',t:'moreless',q:'Which statement is MORE like you?',o:['I trust until I have a concrete reason not to','I feel safest when expectations and boundaries are very explicit']},{c:'Trust',t:'multi',q:'Which behaviors make you feel secure in a relationship?',o:['Consistency','Honesty even when awkward','Following through','Respecting privacy','Including me in important parts of life']},{c:'Trust',t:'situ',q:'Situation: Your partner makes new friends you have never met. What feels most natural?',o:['I am comfortable and let it unfold','I am curious and would like to meet them','I want some context and reassurance','I would feel uncomfortable until I know more']},
{c:'Affection',t:'rate',q:'How much everyday physical affection do you ideally want?',a:'Very little',b:'Very frequent'},{c:'Affection',t:'mc',q:'What makes romance feel most meaningful?',o:['Thoughtful small gestures','Planned dates and experiences','Participating in bonding activities','Deep conversation','Physical closeness']},{c:'Affection',t:'moreless',q:'Which is MORE like you?',o:['I enjoy spontaneous affection throughout ordinary days','Affection feels best when I am already relaxed and emotionally connected']},{c:'Affection',t:'situ',q:'Situation: You have both had an exhausting day. What would make you feel closest?',o:['Cuddle or hold each other','Talk and decompress together','Doing an activity together','Do something thoughtful for each other','Give each other space, then reconnect']},
{c:'Lifestyle',t:'mc',q:'Your ideal free weekend is…',o:['Mostly relaxing together','Going out and trying something new','A mix of plans and downtime','Doing our own things, then reconnecting']},{c:'Lifestyle',t:'multi',q:'Which shared-life habits matter most to you?',o:['Regular date time','Shared hobbies','Time with friends or family','Personal alone time','Spontaneous adventures']},{c:'Lifestyle',t:'rate',q:'How important is having similar social-energy levels?',a:'Not important',b:'Very important'},{c:'Lifestyle',t:'situ',q:'Situation: You unexpectedly get an entire Saturday together. What sounds best?',o:['Make plans and go somewhere','Stay home and relax together','Do one activity, then relax','Each do your own thing for part of the day']},
{c:'Future',t:'mc',q:'When thinking long-term, you prefer…',o:['Clear shared goals and timelines','A direction with room to adapt','Taking life year by year','I do not like planning far ahead']},{c:'Future',t:'rate',q:'How important is it that a serious couple shares a clear vision for the future?',a:'Not important',b:'Essential'},{c:'Future',t:'multi',q:'Which future topics feel important to align on?',o:['Where to live','Career priorities','Marriage or commitment expectations','Children or family structure','Travel and life experiences']},{c:'Future',t:'situ',q:'Situation: One partner gets an exciting opportunity that could significantly change your shared routine. What should happen first?',o:['Talk through how it affects both people','Encourage them to take it, then adjust','Make a pros-and-cons plan together','Protect the current relationship routine unless both strongly agree']},
{c:'Conflict',t:'mc',q:'After an argument, what helps you reconnect?',o:['A calm conversation and resolution','Affection and reassurance','A sincere apology plus changed behavior','Space first, then reconnect']},{c:'Conflict',t:'moreless',q:'Which is MORE like you during conflict?',o:['I want to stay engaged until we understand each other','I communicate better after I have time to cool down']},{c:'Conflict',t:'rate',q:'How important is resolving a disagreement before going to sleep?',a:'Not important',b:'Very important'},{c:'Conflict',t:'situ',q:'Situation: Your partner says something that hurts you but insists they did not mean it that way. What matters most next?',o:['They understand the impact','I understand their intent','We both explain our perspective','We pause before either person gets more defensive']},
{c:'Intimacy',t:'mc',q:'Emotional intimacy grows most through…',o:['Honest vulnerable conversation','Quality time and shared experiences','Physical affection','Helping each other through real life']},{c:'Intimacy',t:'multi',q:'What makes you feel emotionally close?',o:['Sharing fears or insecurities','Laughing and being playful','Physical closeness','Feeling accepted without judgment','Being supported during stress']},{c:'Intimacy',t:'rate',q:'How important is keeping dating energy alive in a long-term relationship?',a:'Not important',b:'Essential'},{c:'Intimacy',t:'situ',q:'Situation: You notice you have felt less connected lately. What would you most want to do first?',o:['Plan intentional quality time','Talk openly about the distance','Increase everyday affection','Do something new together']},
{c:'Love Style',t:'mc',q:'After a hard day, what would make you feel most loved?',o:['Encouraging words','Undivided time together','Help with something practical','A long hug or cuddle','A thoughtful little surprise'],lm:true},{c:'Love Style',t:'multi',q:'Select every gesture that strongly says “I love you” to you.',o:['Specific compliments or appreciation','Uninterrupted time together','Doing something helpful without being asked','Hugs or affectionate touch','A meaningful gift or surprise'],lm:true},{c:'Love Style',t:'moreless',q:'Which is MORE like you?',o:['I feel especially loved when my partner makes focused time for me','I feel especially loved when my partner notices what needs doing and helps'],lm:true},{c:'Love Style',t:'situ',q:'Situation: Your partner wants to make you feel special this week. Which choice would land best?',o:['Write or say something deeply appreciative','Plan uninterrupted time together','Take something stressful off my plate','Be especially physically affectionate','Bring me something thoughtful that shows they noticed me'],lm:true}];
let i=0,A=[],name='',P=null,ME=null,qaMode=new URLSearchParams(location.search).get('qa')==='1';const app=document.querySelector('#app');
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const dec=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))};const base=()=>location.href.split('?')[0].split('#')[0];const B=(t,a,z='')=>`<button class="btn ${z}" data-a="${a}">${t}</button>`;
function home(){app.innerHTML=`<section class=screen><div class=hero><div class=eyebrow>Compatibility • Love Languages • Connection</div><h1>The <span class=grad>Couple Check</span> ♥</h1><p class=sub>32 questions. Two people. No peeking. One shared reveal.</p></div><div class=card><span class=pill>Private two-person check</span><h2>See how you connect.</h2><p class=sub>Take your side, lock your answers, then send your partner a private share link.</p>${B('Take the Couple Check','name')}${B('I have a partner link','join','alt')}</div></section>`}
function nameScreen(){app.innerHTML=`<section class=screen><div class=card><div class=kicker>${P?'Partner 2':'Partner 1'}</div><h2>Who’s owning these answers?</h2>${P?`<p class=sub>You’re checking in with <b>${P.n}</b>. Their answers stay hidden until you lock yours.</p>`:'<p class=sub>Use a first name or nickname.</p>'}<input class=input id=n maxlength=24 placeholder="Name or nickname">${B('Start the check','start')}${B('Back','home','ghost')}</div></section>`}
function qScreen(){let q=Q[i],a=A[i],hint=q.t==='multi'?'Select all that apply.':q.t==='rate'?'Choose from 1 to 5.':q.t==='moreless'?'Choose the statement more like you.':'';let opts=q.t==='rate'?`<div class=ratings>${[1,2,3,4,5].map(n=>`<button class="rate ${a===n?'sel':''}" data-p="${n}">${n}</button>`).join('')}</div><div class=anchors><span>${q.a||'Low'}</span><span>${q.b||'High'}</span></div>`:q.o.map((x,j)=>`<button class="option ${(q.t==='multi'?Array.isArray(a)&&a.includes(j):a===j)?'sel':''}" data-p="${j}"><span class=badge>${String.fromCharCode(65+j)}</span><span>${x}</span></button>`).join('');app.innerHTML=`<section class=screen style="justify-content:flex-start"><div class=top><button class=back data-a=back>← Back</button><div class=pb><div class=meta><span>${q.c}</span><span>${i+1} / ${Q.length}</span></div><div class=prog><i style="width:${(i+1)/Q.length*100}%"></i></div></div></div><div class=card><div class=kicker>${q.t==='multi'?'Select all that apply':'Own your answer'}</div><h2 class=q>${q.q}</h2>${hint?`<p class=tiny>${hint}</p>`:''}<div class=opts>${opts}</div>${B(i===Q.length-1?'Review & lock':'Next →','next',valid(a)?'':'disabled')}</div></section>`;if(!valid(a))app.querySelector('[data-a=next]').disabled=true}
function valid(a){return a!==undefined&&(!Array.isArray(a)||a.length>0)}function start(){name=document.querySelector('#n').value.trim();if(!name)return;A=[];i=0;qScreen()}function next(){if(!valid(A[i]))return;if(i<Q.length-1){i++;qScreen()}else lock()}function back(){if(i){i--;qScreen()}else nameScreen()}
function lock(){app.innerHTML=`<section class=screen><div class=card><div class=kicker>Final check</div><h2>Ready to lock it in?</h2><p class=sub>Once these answers are locked, this run moves forward to the private share/reveal flow.</p>${B('Lock my answers','locked')}${B('Go back','q','alt')}</div></section>`}
function locked(){ME={n:name,a:A};if(!P){let share=base()+'?partner='+encodeURIComponent(enc(ME));app.innerHTML=`<section class=screen><div class=card><div class=kicker>Answers locked</div><h2>Your move is done.</h2><p class=sub>Your answers are packaged into the private partner link. Your partner completes their side before anything is revealed.</p><div class=challenge><strong>Partner Share Link</strong><div class=code id=share>${share}</div></div>${B('Share partner link','share')}${B('Copy partner link','copy','alt')}<div class=challenge><strong>Reveal status</strong><span class=tiny>Waiting for your partner to own their answers.</span></div></div></section>`}else ready()}
function ready(){app.innerHTML=`<section class=screen><div class=card><div class=kicker>Both partners submitted</div><h2>Both answers are locked.</h2><p class=sub>No changing them. No peeking early. The shared reveal is ready.</p>${B('Reveal our Couple Check ♥','results')}</div></section>`}
function pair(q,a,b){if(q.t==='multi'){let x=a||[],y=b||[],u=new Set(x.concat(y)),m=x.filter(v=>y.includes(v)).length;return u.size?Math.round(m/u.size*100):100}if(q.t==='rate')return Math.max(0,100-Math.abs(a-b)*25);return a===b?100:50}function txt(q,a){if(q.t==='rate')return String(a);if(q.t==='multi')return (a||[]).map(x=>q.o[x]).join(', ');return q.o[a]}
function results(){let cats={},scores=[];Q.forEach((q,k)=>{let s=pair(q,ME.a[k],P.a[k]);scores.push(s);(cats[q.c]??=[]).push(s)});let overall=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length),areas=Object.keys(cats).filter(k=>k!=='Love Style').map(k=>[k,Math.round(cats[k].reduce((a,b)=>a+b,0)/cats[k].length)]).sort((a,b)=>b[1]-a[1]);let comps=Q.map((q,k)=>({q,k,s:pair(q,ME.a[k],P.a[k])})).sort((a,b)=>a.s-b.s);let reveal=base()+'?reveal='+encodeURIComponent(enc({p1:P,p2:ME}));let tasks=['Compare the two answers that surprised each of you most and explain why.','Plan one hour of uninterrupted quality time this week with phones away.','Each name one behavior that makes you feel especially secure and appreciated.','Choose one small relationship habit you both want to practice for the next seven days.','Plan a date that combines one person’s preferred style with the other person’s preferred style.'];app.innerHTML=`<section class=screen style="justify-content:flex-start"><div class=hero><div class=eyebrow>${P.n} + ${ME.n}</div><h1>The <span class=grad>Reveal</span> ♥</h1></div><div class=card><div class=kicker>Compatibility result</div><div class=score>${overall}%</div><p class=sub>${overall>=80?'Strong overall alignment with enough differences to keep the relationship dynamic.':overall>=65?'Meaningful common ground, with a few areas worth talking through intentionally.':'More contrast than overlap, making curiosity and clear communication especially useful.'}</p></div><div class=card><div class=kicker>Compatibility by area</div><div class=grid>${areas.map(x=>`<div class=scorebox><span class=tiny>${x[0]}</span><br><strong>${x[1]}%</strong><div class=bar><i style="width:${x[1]}%"></i></div></div>`).join('')}</div></div><div class=card><div class=kicker>Answer comparison</div><h2>Where you matched — and where you didn’t</h2>${comps.slice(0,5).map(x=>`<div class=compare><strong>${x.q.q}</strong><div class=who><div class=answer><span class=tiny>${P.n}</span><br>${txt(x.q,P.a[x.k])}</div><div class=answer><span class=tiny>${ME.n}</span><br>${txt(x.q,ME.a[x.k])}</div></div></div>`).join('')}</div><div class=card><div class=kicker>Relationship insight</div><h2>Strongest alignment: ${areas[0][0]}</h2><p class=sub>Your answers lined up most consistently here.</p><h2>Best conversation starter: ${areas[areas.length-1][0]}</h2><p class=sub>This is where your answers differed most. Compare expectations without assuming either answer is wrong.</p></div><div class=card><div class=kicker>What happens next</div><h2>Your Couple Challenges</h2><p class=sub>Turn the reveal into something you actually do together.</p>${tasks.map((t,j)=>`<div class=challenge><strong>${j+1}. Couple Challenge</strong>${t}</div>`).join('')}</div><div class=card><div class=kicker>Shared reveal</div><h2>Send the finished result back.</h2><div class=code id=reveal>${reveal}</div>${B('Share our reveal ♥','shareReveal')}${B('Copy reveal link','copyReveal','alt')}</div>${B('Take it again','reset','ghost')}</section>`}
function loadReveal(o){P=o.p1;ME=o.p2;results()}function join(){let v=prompt('Paste your Couple Check partner link or code');if(!v)return;try{let token=v.includes('partner=')?new URL(v).searchParams.get('partner'):v;P=dec(token);nameScreen()}catch(e){alert('That partner link/code could not be read.') }}function copy(id){navigator.clipboard?.writeText(document.querySelector(id).textContent)}function share(url,text){navigator.share?navigator.share({title:'The Couple Check',text,url}).catch(()=>{}):navigator.clipboard?.writeText(url)}function reset(){location.href=base()+(qaMode?'?qa=1':'')}
function fake(seed=0){return Q.map((q,k)=>q.t==='multi'?[((k+seed)%q.o.length),((k+seed+2)%q.o.length)].filter((v,n,a)=>a.indexOf(v)===n):q.t==='rate'?1+((k+seed)%5):(k+seed)%q.o.length)}function qa(){let box=document.querySelector('#qa');box.classList.remove('hidden');box.innerHTML=`<h3>Couple Check QA</h3><div class=tiny>Jump through the full two-person flow without answering 32 questions manually.</div><div class=row>${B('Home','qaHome','ghost')}${B('Question 16','qaQ','ghost')}${B('P1 locked','qaP1','ghost')}${B('Both locked','qaBoth','ghost')}${B('Results','qaResults','ghost')}${B('Reload clean','reset','ghost')}</div>`}
app.onclick=e=>{let p=e.target.closest('[data-p]');if(p){let q=Q[i],v=+p.dataset.p;if(q.t==='multi'){let a=Array.isArray(A[i])?A[i].slice():[],k=a.indexOf(v);k>-1?a.splice(k,1):a.push(v);A[i]=a}else A[i]=v;qScreen();return}let a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;if(a==='name'){P=null;nameScreen()}else if(a==='home')home();else if(a==='join')join();else if(a==='start')start();else if(a==='next')next();else if(a==='back')back();else if(a==='q')qScreen();else if(a==='locked')locked();else if(a==='share'){let u=document.querySelector('#share').textContent;share(u,'Take your side of The Couple Check ♥')}else if(a==='copy')copy('#share');else if(a==='results')results();else if(a==='shareReveal'){let u=document.querySelector('#reveal').textContent;share(u,'Our Couple Check reveal is ready ♥')}else if(a==='copyReveal')copy('#reveal');else if(a==='reset')reset();else if(a==='qaHome')home();else if(a==='qaQ'){P=null;name='QA Partner 1';A=fake(0);i=15;qScreen()}else if(a==='qaP1'){P=null;name='QA Partner 1';A=fake(0);locked()}else if(a==='qaBoth'){P={n:'QA Partner 1',a:fake(0)};name='QA Partner 2';A=fake(1);ME={n:name,a:A};ready()}else if(a==='qaResults'){P={n:'QA Partner 1',a:fake(0)};ME={n:'QA Partner 2',a:fake(1)};results()}};
(function(){let s=new URLSearchParams(location.search),r=s.get('reveal'),p=s.get('partner');try{if(r){loadReveal(dec(r))}else if(p){P=dec(p);nameScreen()}else home()}catch(e){home()}if(qaMode)qa()})();
</script><script src="./couple-spark.js"></script><script src="./results-reveal-2.js"></script></body></html>
