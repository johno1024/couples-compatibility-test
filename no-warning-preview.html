<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080607"><title>NO WARNING — The Chemistry Test</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 4%,#2a0c11,#080607 34%);color:#f8f2ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}#app{max-width:720px;margin:auto;padding:24px;min-height:100vh}.s{min-height:calc(100vh - 48px);display:flex;flex-direction:column;justify-content:center}.e{font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#d9aeb1}.brand{font-size:clamp(58px,18vw,100px);line-height:.82;letter-spacing:-.07em;margin:12px 0}.sub{font-size:clamp(22px,7vw,36px);font-weight:900}.p{color:#b8aaa5;line-height:1.6;font-size:17px}.tag{font-weight:950;letter-spacing:.15em;margin-top:30px}.card{border:1px solid #ffffff18;background:#ffffff09;border-radius:26px;padding:24px}.b{width:100%;border:0;border-radius:17px;padding:17px;margin-top:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#d83240,#781019)}.b.alt{background:#ffffff0d;border:1px solid #ffffff18}.input{width:100%;padding:17px;border-radius:16px;border:1px solid #ffffff18;background:#0b0809;color:#fff;font-size:17px}.top{display:flex;gap:10px;align-items:center;margin-bottom:18px}.back{border:0;background:transparent;color:#b8aaa5;font-weight:800}.pb{flex:1}.meta{display:flex;justify-content:space-between;color:#b8aaa5;font-size:11px;text-transform:uppercase}.prog{height:7px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-top:7px}.prog i{display:block;height:100%;background:#d83240}.q{font-size:clamp(27px,7vw,42px);line-height:1.05;letter-spacing:-.04em;margin:10px 0 22px}.opts{display:grid;gap:10px}.o{border:1px solid #ffffff18;background:#ffffff09;color:#fff;text-align:left;padding:16px;border-radius:16px;font-size:16px}.o.sel{border-color:#ce2c3a;background:#9f172338}.big{font-size:clamp(36px,10vw,56px);line-height:.94;letter-spacing:-.05em}.score{font-size:clamp(82px,25vw,132px);font-weight:950;letter-spacing:-.08em}.dim{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #ffffff18}.sec{margin-top:30px}.sec h3{font-size:12px;color:#d9aeb1;letter-spacing:.16em}.ch{margin-top:12px;padding:18px;border:1px solid #ffffff18;border-radius:18px;background:#ffffff09;line-height:1.5}.ch strong{display:block;margin-bottom:8px}.rule{margin-top:20px;padding:16px;border-left:3px solid #cc2d3b;border-radius:12px;background:#9f17231a;line-height:1.5}</style></head><body><main id="app"></main><script>const Q=[['First Spark','What usually creates the first real spark for you?',['Eye contact that lingers','Easy conversation','Playful teasing','Physical presence','A surprising shared interest']],['First Spark','When you are interested in someone, what gives you away first?',['More eye contact','Finding reasons to talk','More teasing','Getting quieter','More physical expression']],['First Spark','Would you rather feel an instant spark or a slow-building pull?',['Instant spark','Slow-building pull']],['First Spark','What makes somebody immediately more attractive to you?',['Confidence','Humor','Warmth','Mystery','Intelligence']],['First Spark','Which signs make you think chemistry might be mutual?',['Longer eye contact','Fast replies','Inside jokes','Finding excuses to be close','Remembering small details','Playful physical contact']],['First Spark','You meet someone and the vibe is unexpectedly strong. What is your instinct?',['Lean into it immediately','Keep it playful and test the vibe','Let them show interest first','Slow down and learn more']],['First Spark','How important is physical attraction at the very beginning?',['Essential','Very important','Important but not enough alone','Connection matters more','It can grow later']],['Flirting','Your natural flirting style is closest to…',['Direct','Playful','Subtle','Bold','I make them wonder']],['Flirting','The conversation gets flirty over text. What do you do?',['Turn it up','Match their energy','Drop one bold line and disappear','Keep it teasing','Wait for them to push it']],['Flirting','Would you rather receive a bold compliment or a subtle one?',['Bold compliment','Subtle compliment']],['Flirting','What kind of flirting works on you?',['Teasing','Compliments','Eye contact','Playful challenges','Voice notes','Suggestive jokes','Unexpected check-ins']],['Flirting','Who should usually make the first move?',['Me','Them','Whoever feels it first','I like a back-and-forth buildup']],['Flirting','How much do you enjoy anticipation?',['A lot — buildup is half the fun','Some — do not drag it out','A little — I prefer directness','Not much']],['Flirting','They send a message with a double meaning. Your move?',['Answer with a better one','Pretend not to notice, then circle back','Call it out directly','Send an emoji and make them work']],['Physical Chemistry','What creates the most physical tension for you?',['Eye contact','Being close without touching','A confident touch','A low voice or whisper','Knowing attraction is mutual']],['Physical Chemistry','Which kinds of affection feel naturally good to you?',['Holding hands','Hugs','Kissing','Cuddling','Touching an arm or back','Sitting close','Playful physical contact']],['Physical Chemistry','How much does scent influence attraction for you?',['A lot','More than people realize','Somewhat','Not much','Almost not at all']],['Physical Chemistry','Would you rather have intense eye contact or effortless physical closeness?',['Intense eye contact','Effortless physical closeness']],['Physical Chemistry','You are sitting close and neither person moves away. What feels natural?',['Let the tension build','Close the distance','Say something playful','Wait for them to make the move']],['Physical Chemistry','Your ideal physical chemistry feels…',['Electric','Warm and affectionate','Playful','Slow and intense','Natural and effortless']],['Physical Chemistry','How comfortable are you with affectionate public touch?',['Very comfortable','Small doses','Depends on the setting','Mostly private','Very private']],['Mental & Emotional Chemistry','What makes conversation feel addictive?',['Humor','Depth','Curiosity','Fast banter','Feeling understood']],['Mental & Emotional Chemistry','Which things make you feel emotionally close?',['Honest conversations','Consistency','Shared humor','Feeling desired','Being listened to','Doing new things together','Quiet comfort']],['Mental & Emotional Chemistry','Would you rather be challenged or instantly understood?',['Challenge my thinking','Understand my thinking']],['Mental & Emotional Chemistry','How important is being able to talk about almost anything?',['Essential','Very important','Important','Nice to have','Not a major factor']],['Mental & Emotional Chemistry','You disagree on something meaningful. What draws you closer?',['Calm debate','Curious questions','Humor first','Direct honesty + reassurance','Space, then talk']],['Mental & Emotional Chemistry','What feels more intimate to you?',['Being fully understood','Being physically close','Being trusted with vulnerability','Laughing hard together','Being chosen consistently']],['Mental & Emotional Chemistry','What makes you feel wanted without somebody saying it?',['They initiate','They remember details','They make time','Their body language changes','They check on me','They flirt intentionally']],['Spontaneity & Boldness','How spontaneous are you when the vibe is right?',['Very','Pretty spontaneous','Depends on the person','I prefer warning','I like a plan']],['Spontaneity & Boldness','They text: “Be ready in an hour. I have an idea.” Your reaction?',["Say less. I'm ready.",'Ask one question, then go','Need a few details','Plan it another time']],['Spontaneity & Boldness','Would you rather plan an unforgettable night or let one happen?',['Plan it','Let it happen unexpectedly']],['Spontaneity & Boldness','Which spontaneous moves sound exciting?',['Late-night drive','Unexpected date','Random voice note','Surprise visit when invited','Trying somewhere new','Daring message','Changing plans']],['Spontaneity & Boldness','When attraction is obvious, how bold are you willing to be?',['Very bold','Bold if they match me','Playfully bold','More subtle','I need them to lead']],['Spontaneity & Boldness','You both keep hinting. What should happen next?',['Someone should say it','Keep teasing','Ask directly','Let actions answer']],['Spontaneity & Boldness','What makes a bold move attractive instead of too much?',['Confidence','Timing','Mutual signals','Humor','Respect for boundaries']],['Spontaneity & Boldness','How much do you enjoy being surprised by someone you trust?',['A lot','Usually','Sometimes','With warning','I prefer the plan']],['No Warning','No warning: they admit they have been thinking about you differently. Your response?',['Tell them where I stand','Make them explain','Tease them first','Make my interest obvious','I need a minute']],['No Warning','What kind of chemistry is hardest to ignore?',['Physical tension','Mental connection','Playful flirting','Emotional closeness','All of it at once']],['No Warning','Which things make you think, “Okay… this might actually be something”?',['Flirting feels different','We talk for hours','Physical tension is obvious','We keep choosing each other','We are unusually comfortable','We bring out boldness']],['No Warning','Final one. The chemistry is mutual. What happens next?',['Say it directly','Plan a real date','Keep the tension alive','Talk honestly about this','Stop overthinking and make a move']]];const M=[5,11,16,23,28,32,39];let i=0,A={},name='Player 1';const app=document.querySelector('#app');const B=(t,a,z='')=>`<button class="b ${z}" data-a="${a}">${t}</button>`;function home(){app.innerHTML=`<section class=s><div class=e>Private two-person chemistry test</div><h1 class=brand>NO<br>WARNING</h1><div class=sub>THE CHEMISTRY TEST</div><p class=p>40 questions. Two people. No peeking. One reveal.</p>${B('TAKE THE TEST','name')}${B('I HAVE A SHARE LINK','ready','alt')}<div class=tag>FLIP IT. FIND OUT.</div></section>`}function np(){app.innerHTML=`<section class=s><div class=card><div class=e>PLAYER 1</div><h2 class=big>WHO’S OWNING THESE ANSWERS?</h2><p class=p>Use a first name or nickname.</p><input class=input id=n placeholder="Name or nickname">${B('START THE TEST','start')}</div></section>`}function qp(){let q=Q[i],m=M.includes(i+1),a=A[i];app.innerHTML=`<section class=s><div class=top><button class=back data-a=back>← BACK</button><div class=pb><div class=meta><span>${q[0]}</span><span>${i+1} / 40</span></div><div class=prog><i style="width:${(i+1)*2.5}%"></i></div></div></div><div class=card><div class=e>${m?'SELECT ALL THAT APPLY':'OWN YOUR ANSWER'}</div><h2 class=q>${q[1]}</h2><div class=opts>${q[2].map((x,j)=>`<button class="o ${(m?Array.isArray(a)&&a.includes(j):a===j)?'sel':''}" data-p="${j}">${x}</button>`).join('')}</div>${B(i===39?'LOCK IT IN':'OWN IT →','next')}</div></section>`}function lock(){app.innerHTML=`<section class=s><div class=card><div class=e>FINAL CHECK</div><h2 class=big>READY TO OWN IT?</h2><p class=p>Once you lock these answers, you cannot change them.</p>${B('LOCK IT IN','links')}${B('GO BACK','q','alt')}</div></section>`}function links(){app.innerHTML=`<section class=s><div class=card><div class=e>ANSWERS LOCKED</div><h2 class=big>YOUR MOVE IS DONE.</h2><p class=p>This preview simulates the two-device Share/Reveal flow.</p><div class=ch><strong>SHARE LINK</strong>Secure share link appears here.</div><div class=ch><strong>REVEAL LINK</strong>Secure reveal link appears here.</div><div class=rule><strong>THEY HAVEN’T OWNED IT YET.</strong><br>Your answers are locked. Their move.</div>${B('SIMULATE PLAYER 2 FINISHING →','ready')}</div></section>`}function ready(){app.innerHTML=`<section class=s><div class=card><div class=e>BOTH PLAYERS SUBMITTED</div><h2 class=big>BOTH ANSWERS ARE LOCKED.</h2><p class=p>No changing them.<br>No explaining them away.</p><div class=tag>FLIP IT. FIND OUT.</div>${B('REVEAL OUR CHEMISTRY →','results')}</div></section>`}const C=(h,t)=>`<div class=ch><strong>${h}</strong>${t}</div>`;function results(){let d=[['🔥 Attraction',88],['😏 Flirting',91],['👀 Tension',94],['💋 Affection',79],['🧠 Mental Chemistry',84],['❤️ Connection',82],['🎲 Spontaneity',87]].map(x=>`<div class=dim><span>${x[0]}</span><strong>${x[1]}%</strong></div>`).join('');app.innerHTML=`<section class=s style="justify-content:flex-start"><div class=e>${name} + PLAYER 2</div><div class=score>87%</div><h2 class=big>THE TENSION IS REAL</h2><p class=p>Strong playful energy, clear attraction and enough shared rhythm to make the differences interesting.</p>${d}<div class=sec><h3>YOUR DYNAMIC</h3><p class=p>You match best when conversation has momentum and neither person has to force the vibe.</p></div><div class=sec><h3>THE MATCH</h3><p class=p>You share a preference for intentional flirting, mutual signals and chemistry that feels natural.</p></div><div class=sec><h3>THE SWITCH-UP</h3><p class=p>One of you is more likely to push the moment forward while the other enjoys anticipation.</p></div><div class=sec><h3>NO WARNING DISCOVERY</h3><p class=p>You both appear more open to spontaneous chemistry than either person might have guessed.</p></div><div class=sec><h3>🔥 PLAY IT OUT</h3>${C('🎙️ VOICE — AFTER HOURS','Send a 10–20 second voice note telling them something about them you find attractive but haven’t directly told them yet. End with: “Your turn.”')}${C('📸 PHOTO — NO CAPTION','Send a photo that represents the vibe you’d want for your next time together. No explanation initially. They have to guess what you mean.')}${C('💬 TEXT — DIFFERENT NOW','Send: “Tell me which answer made you look at me differently, include how and why. I’ll tell you mine after.”')}${C('🎥 VIDEO — READ MY FACE','Send a 5–10 second silent selfie video showing your reaction to one of their answers. They receive three guesses before you explain.')}${C('🎵 MUSIC — SOUNDTRACK US','Send one song representing the chemistry between you right now. Ask them to respond with 🔥 😏 ❤️ 👀 🤔 before you explain why.')}</div><div class=rule><strong>HARD PASS ALWAYS OVERRIDES THE CHALLENGE.</strong><br>Either person can pass. No penalty. No explanation required.<br><br>Chemistry is encouraged. Pressure isn’t.</div></section>`}app.onclick=e=>{let p=e.target.dataset.p;if(p!==undefined){p=+p;if(M.includes(i+1)){let a=Array.isArray(A[i])?[...A[i]]:[];a.includes(p)?a.splice(a.indexOf(p),1):a.push(p);A[i]=a}else A[i]=p;return qp()}let a=e.target.dataset.a;if(a==='name')np();if(a==='start'){name=document.querySelector('#n').value.trim()||'Player 1';qp()}if(a==='back'){if(i)i--;else return np();qp()}if(a==='next'){if(A[i]===undefined||(Array.isArray(A[i])&&!A[i].length))return;if(i<39){i++;qp()}else lock()}if(a==='q')qp();if(a==='links')links();if(a==='ready')ready();if(a==='results')results()};home();</script></body></html>
